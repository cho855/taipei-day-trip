<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台北一日遊 - 預定行程</title>

  <!-- 共用 NAV / base -->
  <link rel="stylesheet" href="/static/index.css" />
  <link rel="stylesheet" href="/static/auth.css" />
  <link rel="stylesheet" href="/static/booking.css" />
</head>

<body>
  <!-- NAV -->
  <header class="nav">
    <div class="container nav-inner">
      <a href="/" class="logo">台北一日遊</a>
      <div class="nav-right">
        <a id="nav-booking" class="nav-link" href="/booking">預定行程</a>
        <button id="nav-auth" type="button" class="nav-btn">登入/註冊</button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container booking-main">
    <!-- greeting -->
    <div id="greeting" class="greeting">您好，<span id="member-name">—</span>，待預訂的行程如下：</div>

    <!-- 預定存在 -->
<section id="booking-section" class="booking-section">
  <div class="booking-card">

   
    <div class="booking-img-frame">
      <img id="booking-image" class="booking-img" alt="attraction" />
    </div>

  
    <div class="booking-info-frame">

      <!-- 刪除按鈕在右上 -->
      <div class="booking-title-row">
        <a id="booking-title" class="booking-title" href="#">台北一日遊：—</a>

        <button id="delete-booking" class="booking-delete" type="button" aria-label="delete">
          <img src="/static/images/icon_delete.png" alt="delete" />
        </button>
      </div>

      <div class="booking-row"><span class="label">日期： </span><span id="booking-date">—</span></div>
      <div class="booking-row"><span class="label">時間： </span><span id="booking-time">—</span></div>
      <div class="booking-row"><span class="label">費用： </span><span id="booking-price">—</span></div>
      <div class="booking-row"><span class="label">地點： </span><span id="booking-address">—</span></div>

    </div>
  </div>
</section>


    <!--無預定 -->
    <div id="empty-state" class="empty-state hidden">
      目前沒有任何待預定的行程
    </div>

<div id="details-sections">
    <!-- divider -->
    <hr class="divider" />

    <!-- 聯絡資訊 -->
    <section id="contact-section" class="section">
      <h2 class="section-title">您的聯絡資訊</h2>

      <div class="form-row">
        <label class="form-label">聯絡姓名：</label>
        <input id="contact-name" class="form-input" type="text" placeholder="" />
      </div>

      <div class="form-row">
        <label class="form-label">連絡信箱：</label>
        <input id="contact-email" class="form-input" type="email" placeholder="" />
      </div>

      <div class="form-row">
        <label class="form-label">手機號碼：</label>
        <input id="contact-phone" class="form-input" type="tel" placeholder="" />
      </div>

      <p class="hint">
        請保持手機暢通，準時到達，導覽人員將用手機與您聯繫，務必留下正確的聯絡方式。
      </p>
    </section>

    <!-- divider -->
    <hr class="divider" />

    <!-- 信用卡 -->
    <section id="payment-section" class="section">
      <h2 class="section-title">信用卡付款資訊</h2>

      <div class="form-row">
        <label class="form-label">卡片號碼：</label>
        <input id="card-number" class="form-input" type="text" placeholder="**** **** **** ****" />
      </div>

      <div class="form-row">
        <label class="form-label">過期時間：</label>
        <input id="card-exp" class="form-input" type="text" placeholder="MM / YY" />
      </div>

      <div class="form-row">
        <label class="form-label">驗證密碼：</label>
        <input id="card-ccv" class="form-input" type="text" placeholder="CCV" />
      </div>
    </section>

    <!-- checkout -->
    <section id="checkout-section" class="checkout">
      <div class="total">總價：新台幣<span id="total-price">0</span>元</div>
      <button id="pay-btn" class="pay-btn" type="button">確認訂購並付款</button>
      <div id="pay-msg" class="pay-msg"></div>
    </section>
  </div>  
  </main>

  <!-- footer -->
  <footer class="footer">COPYRIGHT © 2021 台北一日遊</footer>

  <!-- scripts -->
  <script src="/static/auth.js" defer></script>
  <script src="/static/booking.js" defer></script>
</body>
</html>
