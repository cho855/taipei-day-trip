<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台北一日遊</title>


  <link rel="stylesheet" href="/static/index.css" />
  <link rel="stylesheet" href="/static/auth.css" />

</head>
<body>


  <header class="nav">
    <div class="container nav-inner">
      <a href="/" class="logo">台北一日遊</a>
      <div class="nav-right">
         <a class="nav-link" href="/booking">預定行程</a>
         <button id="nav-auth" type="button" class="nav-btn">登入/註冊</button>
      </div>
    </div>
  </header>


  <section class="hero">
    <div class="container hero-content">
      <h1>輕鬆享受台北一日悠閒</h1>
      <p>探索每個角落，體驗城市的深度旅遊行程</p>

      <div class="search-bar">      
        <div class="category-wrapper">
          <button id="category-btn" class="category-btn">
            <span id="category-text">全部分類</span>
            <span class="category-arrow">▾</span>
          </button>

          <div id="category-panel" class="category-panel hidden">
            <div id="category-list" class="category-list"></div>
          </div>
        </div>

        
        <input id="keyword-input" type="text" placeholder="輸入景點名稱查詢" />

    
        <button id="search-btn" class="search-btn">
  <img src="/static/images/search.png" alt="search" />
</button>
      </div>
    </div>
  </section>

 
  <section class="mrt">
    <div class="container mrt-inner">
      <button id="mrt-left" class="arrow">
        <img src="/static/images/left.png" alt="left" />
      </button>
      <div class="mrt-scroll">
        <div id="mrt-list" class="mrt-list"></div>
      </div>
      <button id="mrt-right" class="arrow">
        <img src="/static/images/right.png" alt="right" />
      </button>
    </div>
  </section>


  <section class="attractions">
    <div class="container">
      <div id="attraction-list" class="grid"></div>
      <div id="sentinel"></div>
    </div>
  </section>


  <footer class="footer">
    COPYRIGHT © 2021 台北一日遊
  </footer>
<!-- =========================
     Auth Modal (for auth.js)
========================== -->
<div id="auth-overlay" class="auth-overlay">
  <div class="auth-dialog is-signin" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <div class="auth-topbar"></div>

    <button type="button" class="auth-close" aria-label="close">
      <img src="/static/images/icon_close.png" alt="close">
    </button>

    <div class="auth-body">
      <h3 id="auth-title" class="auth-title">登入會員帳號</h3>

      <!-- Sign In -->
      <form id="form-signin">
        <input id="signin-email" class="auth-input" type="email" placeholder="輸入 Email" required />
        <input id="signin-password" class="auth-input" type="password" placeholder="輸入密碼" required />
        <button type="submit" class="auth-primary-btn">登入帳戶</button>

        <div id="signin-msg" class="auth-msg"></div>

        <div class="auth-switch">
          還沒有帳戶？<a href="#" id="to-signup" class="auth-link">點此註冊</a>
        </div>
      </form>

      <!-- Sign Up -->
      <form id="form-signup" style="display:none;">
        <input id="signup-name" class="auth-input" type="text" placeholder="輸入姓名" required />
        <input id="signup-email" class="auth-input" type="email" placeholder="輸入 Email" required />
        <input id="signup-password" class="auth-input" type="password" placeholder="輸入密碼" required />
        <button type="submit" class="auth-primary-btn">註冊帳戶</button>

        <div id="signup-msg" class="auth-msg"></div>

        <div class="auth-switch">
          已經有帳戶？<a href="#" id="to-signin" class="auth-link">點此登入</a>
        </div>
      </form>
    </div>
  </div>
</div>


  <script src="/static/auth.js" defer></script>
  <script src="/static/index.js" defer></script>
</body>
</html>
